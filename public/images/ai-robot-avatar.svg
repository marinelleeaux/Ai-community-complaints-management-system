<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="botCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="botHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#botCircle)"/>

  <!-- Antenna -->
  <circle cx="32" cy="14" r="3" fill="#2563EB"/>
  <rect x="30.5" y="16" width="3" height="6" fill="#2563EB"/>

  <!-- Robot Head -->
  <rect x="16" y="22" width="32" height="24" rx="8" fill="url(#botHead)"/>

  <!-- Ears / Bolts -->
  <rect x="13" y="29" width="3" height="10" rx="1.5" fill="#60A5FA"/>
  <rect x="48" y="29" width="3" height="10" rx="1.5" fill="#60A5FA"/>

  <!-- Face Screen -->
  <rect x="20" y="26" width="24" height="16" rx="5" fill="#0B132B"/>

  <!-- Eyes (Glowing Cyan) -->
  <circle cx="26" cy="33" r="3" fill="#38BDF8"/>
  <circle cx="38" cy="33" r="3" fill="#38BDF8"/>

  <!-- Smile -->
  <path d="M 28 38 Q 32 41 36 38" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Neck & Shoulder hints -->
  <rect x="28" y="46" width="8" height="4" rx="1" fill="#93C5FD"/>
  <path d="M 18 54 C 22 50, 42 50, 46 54 Z" fill="#2563EB"/>
</svg>
