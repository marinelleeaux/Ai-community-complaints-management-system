<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="greenBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Parchment Card Background -->
  <rect x="4" y="4" width="100" height="74" rx="8" fill="url(#certBg)" stroke="url(#goldBorder)" stroke-width="2"/>
  
  <!-- Inner Ornate Inset Border -->
  <rect x="8" y="8" width="92" height="66" rx="5" fill="none" stroke="#D97706" stroke-width="0.75" stroke-dasharray="3,1.5"/>

  <!-- Corner Flourishes -->
  <path d="M 12 16 L 16 12 M 12 12 L 18 12 M 12 12 L 12 18" stroke="#B45309" stroke-width="1" fill="none"/>
  <path d="M 96 16 L 92 12 M 96 12 L 90 12 M 96 12 L 96 18" stroke="#B45309" stroke-width="1" fill="none"/>

  <!-- "CERTIFICATE" Header -->
  <text x="54" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="7.5" font-weight="900" fill="#92400E" text-anchor="middle" letter-spacing="1.5">CERTIFICATE</text>

  <!-- Divider Line with Diamond -->
  <line x1="24" y1="26" x2="84" y2="26" stroke="#D97706" stroke-width="0.6"/>
  <polygon points="54,24.5 56,26 54,27.5 52,26" fill="#B45309"/>

  <!-- "Verified Resident" Cursive/Serif Text -->
  <text x="54" y="38" font-family="Georgia, serif" font-style="italic" font-size="9" font-weight="bold" fill="#1E293B" text-anchor="middle">Verified Resident</text>

  <!-- Placeholder Certificate Details -->
  <text x="54" y="47" font-family="sans-serif" font-size="4.5" fill="#64748B" text-anchor="middle">Barangay North Poblacion • Maramag</text>
  <line x1="28" y1="53" x2="80" y2="53" stroke="#CBD5E1" stroke-width="0.8"/>
  <line x1="36" y1="58" x2="72" y2="58" stroke="#E2E8F0" stroke-width="0.8"/>

  <!-- Miniature Gold Seal Ribbons -->
  <path d="M 28 58 L 24 68 L 29 65 L 34 68 Z" fill="#D97706"/>
  <circle cx="29" cy="59" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="0.8"/>
  <circle cx="29" cy="59" r="4" fill="none" stroke="#FEF3C7" stroke-width="0.6"/>

  <!-- Overlapping Green Checkmark Badge at Bottom-Right -->
  <g transform="translate(90, 60)" filter="url(#badgeShadow)">
    <circle cx="13" cy="13" r="13" fill="url(#greenBadge)" stroke="#FFFFFF" stroke-width="2.5"/>
    <path d="M 8 13 L 11.5 16.5 L 18 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
