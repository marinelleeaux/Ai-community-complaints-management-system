<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="blueCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6DEB"/>
      <stop offset="100%" stop-color="#0A52C4"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0A52C4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Blue Circular Badge Base -->
  <circle cx="50" cy="50" r="48" fill="url(#blueCircleGrad)" filter="url(#softGlow)"/>
  <circle cx="50" cy="50" r="46.5" stroke="#93C5FD" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Pediment (Triangular Gable Roof) -->
  <polygon points="50,21 21,37 79,37" fill="#FFFFFF"/>
  <!-- Central Small Round Emblem in Pediment -->
  <circle cx="50" cy="31" r="2.8" fill="#1E6DEB"/>

  <!-- Entablature / Architrave (Roof Beam) -->
  <rect x="20" y="38" width="60" height="4.5" rx="1.5" fill="#FFFFFF"/>

  <!-- 4 Classical Architectural Columns -->
  <!-- Column 1 -->
  <rect x="25" y="44.5" width="6.5" height="24" rx="2" fill="#FFFFFF"/>
  <!-- Column 2 -->
  <rect x="39" y="44.5" width="6.5" height="24" rx="2" fill="#FFFFFF"/>
  <!-- Column 3 -->
  <rect x="54.5" y="44.5" width="6.5" height="24" rx="2" fill="#FFFFFF"/>
  <!-- Column 4 -->
  <rect x="68.5" y="44.5" width="6.5" height="24" rx="2" fill="#FFFFFF"/>

  <!-- Base Podium Steps (Plinth) -->
  <rect x="18" y="70" width="64" height="4" rx="1.5" fill="#FFFFFF"/>
  <rect x="15" y="75" width="70" height="4.5" rx="1.8" fill="#FFFFFF"/>
</svg>
