  <polygon points="76,125 78,129 82,129 79,132 80,136 76,134 72,136 73,132 70,129 74,129" fill="#FCD116"/>
  <polygon points="124,125 126,129 130,129 127,132 128,136 124,134 120,136 121,132 118,129 122,129" fill="#FCD116"/>
