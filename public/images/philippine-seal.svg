    <path id="phTextBottom" d="M 172 100 A 72 72 0 0 1 28 100" />
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="#0038A8" stroke="#FCD116" stroke-width="4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FCD116" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="100" r="74" fill="#FFFFFF" stroke="#CE1126" stroke-width="3"/>

  <!-- Top Inscription -->
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">
    <textPath href="#phTextTop" startOffset="50%" text-anchor="middle">
      REPUBLIC OF THE PHILIPPINES
    </textPath>
  </text>

  <!-- Bottom Inscription -->
  <text font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#FCD116" letter-spacing="1.5">
