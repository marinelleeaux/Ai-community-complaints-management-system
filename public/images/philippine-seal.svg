  <g stroke="#FCD116" stroke-width="2.5" stroke-linecap="round">
    <line x1="100" y1="86" x2="100" y2="90"/>
    <line x1="100" y1="120" x2="100" y2="124"/>
    <line x1="81" y1="105" x2="85" y2="105"/>
    <line x1="115" y1="105" x2="119" y2="105"/>
    <line x1="87" y1="92" x2="90" y2="95"/>
    <line x1="113" y1="118" x2="110" y2="115"/>
    <line x1="113" y1="92" x2="110" y2="95"/>
    <line x1="87" y1="118" x2="90" y2="115"/>
  </g>

